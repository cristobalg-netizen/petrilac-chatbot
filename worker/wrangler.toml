name = "petrilac-chatbot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# ANTHROPIC_API_KEY is a SECRET — never put it here. Set it in the Cloudflare
# dashboard (Workers & Pages → tu Worker → Settings → Variables and Secrets →
# Add → Encrypt) or locally via `wrangler secret put ANTHROPIC_API_KEY`.
# [vars] below are plain (non-secret) config, editable directly here.
[vars]
MODEL = "claude-haiku-4-5"
# Locked to the GitHub Pages test page + the real site (comma-separated).
ALLOWED_ORIGIN = "https://cristobalg-netizen.github.io,https://www.petrilac.com"
