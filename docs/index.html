<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Petrilac — Test del chatbot</title>
<style>
  html,body{margin:0;height:100%;}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:#fff url("./img/petrilac-home.jpg") top center / cover no-repeat;
    min-height:100vh;
  }
  /* Etiqueta discreta de "modo prueba": se expande para cambiar el endpoint */
  #test-chip{
    position:fixed;left:14px;bottom:14px;z-index:10;
    background:rgba(20,20,20,.78);color:#fff;border-radius:10px;
    font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);
    max-width:calc(100vw - 120px);
  }
  #test-chip summary{cursor:pointer;padding:8px 12px;list-style:none;font-weight:600;}
  #test-chip summary::-webkit-details-marker{display:none;}
  #test-chip summary::before{content:"● ";color:#8CFF8C;}
  #test-chip .body{padding:0 12px 12px;width:320px;max-width:100%;}
  #test-chip label{display:block;margin:4px 0 6px;opacity:.8;}
  #test-chip input{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:6px;border:none;font-size:12px;}
  #test-chip button{margin-top:8px;background:#F05423;color:#fff;border:none;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;}
  #test-chip p{margin:8px 0 0;opacity:.7;line-height:1.4;}
</style>
</head>
<body>

<details id="test-chip">
  <summary>Modo prueba — no es el sitio real</summary>
  <div class="body">
    <label for="endpoint">URL del backend (Worker)</label>
    <input type="text" id="endpoint" />
    <button id="save">Guardar y recargar chat</button>
    <p>El fondo es una captura estática del inicio de petrilac.com; solo el chat (abajo a la derecha) es funcional.</p>
  </div>
</details>

<script>
  var DEFAULT_ENDPOINT = "https://petrilac-chatbot.cristobalg.workers.dev/chat";
  var STORAGE_KEY = "petrilac_test_endpoint";
  var input = document.getElementById("endpoint");
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  input.value = saved || DEFAULT_ENDPOINT;

  function loadWidget(endpoint) {
    ["pt-widget-script","pt-chat-bubble","pt-chat-panel"].forEach(function (id) {
      var el = document.getElementById(id); if (el) el.remove();
    });
    var s = document.createElement("script");
    s.id = "pt-widget-script";
    s.src = "./widget/petrilac-chat-widget.js";
    s.setAttribute("data-endpoint", endpoint);
    document.body.appendChild(s);
  }

  document.getElementById("save").addEventListener("click", function () {
    var val = input.value.trim() || DEFAULT_ENDPOINT;
    try { localStorage.setItem(STORAGE_KEY, val); } catch (e) {}
    loadWidget(val);
    document.getElementById("test-chip").open = false;
  });

  loadWidget(input.value);
</script>
</body>
</html>
